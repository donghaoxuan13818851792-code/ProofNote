name: branch-autofix

on:
  push:
    branches: [blue-team-hardening-20260916]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch imported-template collision handling
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          editor = Path('src/document-editor.js')
          text = editor.read_text()
          old = '''      const template = Model.normalizeTemplate(raw);
      const backend = await Store.saveTemplate(template);
      if (backend === "failed") { showImportMessage(tr("模板无法保存到此设备；请释放存储空间后重试。", "Template could not be saved on this device; free storage and try again."), "error"); return; }
      await refreshTemplates();
      closeImport();
      warnings = warnings.concat(validation.warnings || []);
'''
          new = '''      warnings = warnings.concat(validation.warnings || []);
      let template = Model.normalizeTemplate(raw);
      // Import is additive. `saveTemplate` is intentionally an upsert for
      // explicit template edits, but an imported portable file must never
      // overwrite an existing local template merely because both carry the
      // same portable id.
      const storedTemplateIds = new Set((await Store.listTemplates())
        .map((item) => item && item.template && item.template.id)
        .filter((id) => typeof id === "string" && id));
      if (storedTemplateIds.has(template.template.id)) {
        const importedInfo = { name: template.template.name, description: template.template.description };
        do { template = Model.makeTemplate(template.document, importedInfo); }
        while (storedTemplateIds.has(template.template.id));
        warnings.push({
          path: "template.id",
          message: tr("模板 ID 已存在；已作为新模板导入。", "Template ID already exists; imported as a new template.")
        });
      }
      const backend = await Store.saveTemplate(template);
      if (backend === "failed") { showImportMessage(tr("模板无法保存到此设备；请释放存储空间后重试。", "Template could not be saved on this device; free storage and try again."), "error"); return; }
      await refreshTemplates();
      closeImport();
'''
          if old not in text:
              raise SystemExit('template import source pattern not found')
          editor.write_text(text.replace(old, new, 1))

          test = Path('tests/document-editor.js')
          text = test.read_text()
          token = '    const blankProjectImportPayload = {'
          if token not in text:
              raise SystemExit('template collision test anchor not found')
          regression = textwrap.dedent(r'''
          // Importing a template is additive: a portable id collision must not
          // silently overwrite a template already saved on this device.
          const existingCollisionTemplate = {
            format: "proofnote-template",
            version: "1.0",
            template: { id: "collision-template", name: "Original local template", description: "keep me" },
            document: {
              format: "proofnote-document",
              version: "1.0",
              metadata: { name: "Original local template document" },
              blocks: [{ type: "title", content: "Original local template document" }]
            }
          };
          await window.ProofnoteStore.saveTemplate(existingCollisionTemplate);
          const incomingCollisionTemplate = {
            format: "proofnote-template",
            version: "1.0",
            template: { id: "collision-template", name: "Imported collision template", description: "new import" },
            document: {
              format: "proofnote-document",
              version: "1.0",
              metadata: { name: "Imported collision template document" },
              blocks: [{ type: "title", content: "Imported collision template document" }]
            }
          };
          if (importText) importText.value = JSON.stringify(incomingCollisionTemplate);
          if (confirmImport) confirmImport.click();
          await settle(window, async () => (await window.ProofnoteStore.listTemplates()).some((item) => item.template?.name === "Imported collision template"), 1500);
          const collisionTemplatesAfterImport = await window.ProofnoteStore.listTemplates();
          const preservedCollisionTemplate = collisionTemplatesAfterImport.find((item) => item.template?.id === "collision-template");
          const newlyImportedCollisionTemplate = collisionTemplatesAfterImport.find((item) => item.template?.name === "Imported collision template");
          check(
            "editor-template-import-id-collision-does-not-overwrite-local-template",
            preservedCollisionTemplate?.template?.name === "Original local template"
              && preservedCollisionTemplate?.template?.description === "keep me"
              && Boolean(newlyImportedCollisionTemplate)
              && newlyImportedCollisionTemplate.template.id !== "collision-template"
              && /recoverable notice|可恢复提示/.test(document.querySelector("#pnStatus")?.textContent || "")
              && editorSource.includes("an imported portable file must never")
              && editorSource.includes("storedTemplateIds.has(template.template.id)"),
            JSON.stringify(collisionTemplatesAfterImport.map((item) => item.template))
          );

          ''').strip('\n')
          regression = textwrap.indent(regression, '    ') + '\n'
          test.write_text(text.replace(token, regression + token, 1))
          PY
      - run: npm ci
      - run: npm test
      - name: Commit branch-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/document-editor.js tests/document-editor.js
          git commit -m "fix: preserve local templates on import collision"
          git push origin HEAD:blue-team-hardening-20260916
