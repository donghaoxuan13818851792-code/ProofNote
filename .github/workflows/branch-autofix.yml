name: branch-autofix

on:
  push:
    branches: [blue-team-hardening-20260916]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Diagnose unsupported image sources
        run: |
          python - <<'PY'
          from pathlib import Path

          model = Path('src/document-model.js')
          s = model.read_text()
          old = '''      if (block.type === "image") {
            ["src", "alt", "caption"].forEach((key) => expectString(path + "." + key, block[key]));
            if (typeof block.src === "string" && /^data:image\\//i.test(block.src) && block.src.length > LIMITS.maxImageDataUrlLength) error(path + ".src", "Embedded image exceeds the maximum supported size.");
            if (block.remoteApproved !== undefined && typeof block.remoteApproved !== "boolean") warn(path + ".remoteApproved", "Remote-image approval is ignored unless it is a boolean.");
          }
          '''
          new = '''      if (block.type === "image") {
            ["src", "alt", "caption"].forEach((key) => expectString(path + "." + key, block[key]));
            if (typeof block.src === "string") {
              const source = block.src.trim();
              const supportedRemote = /^https:\\/\\//i.test(source);
              const supportedEmbedded = /^data:image\\/(png|jpe?g|gif|webp);base64,/i.test(source);
              if (source && !supportedRemote && !supportedEmbedded) warn(path + ".src", "Unsupported image source; use an HTTPS URL or a PNG/JPEG/GIF/WebP base64 data image.");
              if (/^data:image\\//i.test(source) && source.length > LIMITS.maxImageDataUrlLength) error(path + ".src", "Embedded image exceeds the maximum supported size.");
            }
            if (block.remoteApproved !== undefined && typeof block.remoteApproved !== "boolean") warn(path + ".remoteApproved", "Remote-image approval is ignored unless it is a boolean.");
          }
          '''
          if old not in s:
              raise SystemExit('image validation source pattern not found')
          model.write_text(s.replace(old, new, 1))

          test = Path('tests/document-model.js')
          s = test.read_text()
          anchor = '''const remoteImageRaw = { format: Model.FORMAT, version: Model.VERSION, metadata: { name: "Image" }, blocks: [{ type: "image", src: "https://example.test/pixel.png", remoteApproved: true }] };
          check("document-import-does-not-trust-remote-image-approval", Model.normalizeDocument(remoteImageRaw).blocks[0].remoteApproved !== true && Model.normalizeDocument(remoteImageRaw, { allowRemoteImages: true }).blocks[0].remoteApproved === true, JSON.stringify(Model.normalizeDocument(remoteImageRaw)));
          '''
          addition = anchor + '''const unsupportedImageSource = Model.validateDocumentRaw({ format: Model.FORMAT, version: Model.VERSION, metadata: { name: "Unsupported image" }, blocks: [{ type: "image", src: "http://example.test/pixel.png" }, { type: "image", src: "data:image/svg+xml;base64,PHN2Zz4=" }] });
          check("document-import-warns-on-image-sources-the-renderer-will-refuse", unsupportedImageSource.errors.length === 0
            && unsupportedImageSource.warnings.filter((warning) => /Unsupported image source/.test(warning.message)).length === 2
            && unsupportedImageSource.warnings.some((warning) => warning.path === "blocks[0].src")
            && unsupportedImageSource.warnings.some((warning) => warning.path === "blocks[1].src"), JSON.stringify(unsupportedImageSource));
          '''
          if anchor not in s:
              raise SystemExit('image test anchor not found')
          test.write_text(s.replace(anchor, addition, 1))
          PY
      - run: npm ci
      - run: npm test
      - name: Commit branch-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/document-model.js tests/document-model.js
          git commit -m "fix: report unsupported image sources"
          git push origin HEAD:blue-team-hardening-20260916
