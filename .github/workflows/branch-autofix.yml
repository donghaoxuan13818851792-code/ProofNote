name: branch-autofix

on:
  push:
    branches: [blue-team-hardening-20260916]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply blue-team persistence fixes
        run: |
          echo '     nCiAgICBpZiBhbmNob3Igbm90IGluIHQ6CiAgICAgICAgcmFpc2UgU3lzdGVtRXhpdCgidHJhbnNpdGlvbiByZWdyZXNzaW9uIGFuY2hvciBub3QgZm91bmQiKQogICAgdCA9IHQucmVwbGFjZShhbmNob3IsIHJlZ3Jlc3Npb24gKyBhbmNob3IsIDEpCnRlc3RzLndyaXRlX3RleHQodCkK' | base64 -d | python
      - run: npm ci
      - run: npm test
      - name: Commit branch-only fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/document-editor.js src/document-store.js tests/document-editor.js tests/blue-team.js
          git commit -m "fix: harden document transitions and stale saves"
          git push origin HEAD:blue-team-hardening-20260916
