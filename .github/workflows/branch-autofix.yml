name: branch-autofix

on:
  push:
    branches: [blue-team-hardening-20260916]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prevent current-document deletion resurrection
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/document-editor.js')
          s = p.read_text()
          old = '''      onConfirm: async () => {
            const backend = await Store.deleteDocument(id);
            if (backend === "failed") { setStatus(tr("删除文档失败。", "Could not delete document."), "error"); return; }
            if (id === currentDocumentId) {
              const opened = await openRemainingDocumentAfterDeletion();
              if (!opened) { setStatus(tr("删除后无法打开其余文档。", "Could not open a remaining document after deletion."), "error"); return; }
              setStatus(tr("文档已删除", "Document deleted"), "saved");
            } else {
              await refreshDocuments();
              setStatus(tr("文档已删除", "Document deleted"), "saved");
            }
          }
          '''
          # The workflow YAML adds four indentation spaces to the script text;
          # Python's heredoc removes none. Normalize the source snippet once.
          old = old.replace('\n    ', '\n')
          new = '''      onConfirm: async () => {
            const deletingCurrent = id === currentDocumentId;
            if (deletingCurrent) {
              // Deletion intentionally discards edits that have not entered the save
              // queue yet. A save already in flight is different: it must finish
              // before deletion, otherwise it can complete afterwards and recreate
              // the record the author just removed.
              clearTimeout(saveTimer);
              try { await saveQueue; } catch (_) {}
            }
            const backend = await Store.deleteDocument(id);
            if (backend === "failed") { setStatus(tr("删除文档失败。", "Could not delete document."), "error"); return; }
            if (deletingCurrent) {
              const opened = await openRemainingDocumentAfterDeletion();
              if (!opened) { setStatus(tr("删除后无法打开其余文档。", "Could not open a remaining document after deletion."), "error"); return; }
              setStatus(tr("文档已删除", "Document deleted"), "saved");
            } else {
              await refreshDocuments();
              setStatus(tr("文档已删除", "Document deleted"), "saved");
            }
          }
          '''
          new = new.replace('\n    ', '\n')
          if old not in s:
              raise SystemExit('delete confirmation source pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm test
      - name: Commit branch-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/document-editor.js
          git commit -m "fix: serialize deletion behind pending saves"
          git push origin HEAD:blue-team-hardening-20260916
